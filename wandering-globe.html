<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandering Globe — Planet Jumping Space Portal Experience</title>
  <style>
    /* ====================================================================
       2. FONTS
       ==================================================================== */
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro Thin';
      src: local('SF Pro Text Thin'), local('SF Pro Thin'), local('SFProText-Thin');
      font-weight: 100;
      font-style: normal;
    }
    @font-face {
      font-family: 'Aalto';
      src: local('Aalto'), local('Aalto-Regular');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
    }

    /* ====================================================================
       5. LAYOUT CSS (exact values)
       ==================================================================== */
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090807;
    }
    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      background: #0a0908;
    }
    .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .background.is-visible {
      opacity: 1;
    }
    .shade {
      z-index: 1;
      background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, 0.88) 100%);
      pointer-events: none;
    }
    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity 0.45s ease, filter 0.45s ease;
    }
    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    /* HEADER */
    .header {
      left: clamp(18px, 1.95vw, 28px);
      right: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 5px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 19px;
      border-radius: 999px;
      line-height: 1;
    }
    .nav a.active {
      background: #fff;
      color: #000;
    }
    .menu {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }

    /* SIDEBAR */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: rgba(255, 255, 255, 0.7);
    }
    .planet-item.active {
      font-size: 18px;
      font-weight: 700;
      gap: 8px;
      color: #fff;
    }
    .planet-item.active:before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      display: inline-block;
      flex-shrink: 0;
    }

    /* PORTAL */
    .portal-wrap {
      left: 50%;
      top: 50%;
      width: min(320px, 31vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      opacity: 0;
    }
    .portal-heading strong {
      font-size: 18px;
      margin-left: 8px;
    }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320 / 350;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transform: none !important;
    }
    .portal video, .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* CONTENT */
    .planet-content {
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }
    .planet-content h1 {
      font-family: Aalto, 'Arial Narrow', sans-serif;
      font-size: clamp(128px, 21.8vw, 314px);
      font-weight: 400;
      line-height: 0.72;
      margin: 0 0 -0.04em;
      letter-spacing: 0;
      transform: translateX(-32px);
      opacity: 0;
      text-transform: uppercase;
    }
    .planet-content dl {
      width: min(447px, 34vw);
      margin: 0;
      font-size: 16px;
    }
    .fact {
      display: grid;
      grid-template-columns: 138px 1fr;
      gap: 18px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.48);
      opacity: 0;
    }
    .fact:last-child {
      border-bottom: 0;
    }
    .fact dt {
      font-weight: 700;
    }
    .fact dd {
      margin: 0;
    }

    /* MISC */
    .transition-layer {
      display: none;
    }
    .scene-canvas {
      display: none;
    }
    .loading {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      opacity: 0;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .experience.is-loading .loading {
      opacity: 0.8;
    }
    .experience.is-transitioning .header,
    .experience.is-transitioning .planet-list {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .experience.is-transitioning .shade {
      opacity: 1;
    }
    .experience.is-committing .background {
      transition: none !important;
    }

    /* ====================================================================
       6. PRELOADER
       ==================================================================== */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      overflow: hidden;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, #000);
    }
    .preloader.is-background {
      z-index: 0;
    }
    .preloader.is-background .preloader-shade {
      opacity: 0;
    }
    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 59px;
      height: 58px;
      transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition: left 2s cubic-bezier(0.16, 1, 0.3, 1),
                  top 2s cubic-bezier(0.16, 1, 0.3, 1),
                  width 2s cubic-bezier(0.16, 1, 0.3, 1),
                  height 2s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-logo.is-docked {
      left: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      width: 37px;
      height: 36px;
      transform: none;
    }
    .floating-logo.is-settled {
      z-index: 5;
    }
    .preloader-count {
      position: fixed;
      z-index: 22;
      left: 50%;
      bottom: clamp(22px, 3.1vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      font-family: 'SF Pro', Arial, sans-serif;
      line-height: 1;
    }
    .preloader-count > span:first-child {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 64px;
      font-weight: 100;
    }
    .preloader-count .percent {
      font-size: 24px;
      padding-bottom: 4px;
    }
    .preloader-count.is-leaving {
      animation: preload-count-out 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes preload-count-out {
      to {
        opacity: 0;
        filter: blur(7px);
        transform: translate(-50%, -34px);
      }
    }
    body:not(.preload-complete) .custom-cursor {
      opacity: 0 !important;
    }

    /* ====================================================================
       9. NATIVE HARDWARE CURSOR (Clean & Smooth)
       ==================================================================== */
    html, body {
      cursor: auto;
    }
    button, a, .portal, .planet-item {
      cursor: pointer;
    }
    .custom-cursor {
      display: none !important;
    }
    .custom-cursor.is-visible {
      opacity: 1;
    }
    .cursor-dot, .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 12px;
      height: 12px;
      background: #fff;
    }
    .cursor-orbit {
      width: 36px;
      height: 36px;
      border: 1px solid #fff;
      background: rgba(255, 255, 255, 0.4);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .custom-cursor.is-enter .cursor-orbit {
      transform: translate(-50%, -50%) scale(1.16);
    }
    .cursor-label {
      position: absolute;
      top: 26px;
      left: 0;
      transform: translateX(-50%) translateY(-4px);
      font: 16px / 1.2 'SF Pro', Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ====================================================================
       10. ENTRANCE / SWITCH ANIMATIONS
       ==================================================================== */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list,
    body:not(.intro-ready) .planet-content h1,
    body:not(.intro-ready) .planet-content .fact {
      opacity: 0;
    }
    .intro-ready .header {
      animation: reveal-down 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    .intro-ready .planet-list {
      animation: reveal-side 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
    }
    .content-revealing h1 {
      animation: title-rise 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .content-revealing .fact {
      animation: fact-rise 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .fact:nth-child(1) { animation-delay: 0.52s; }
    .fact:nth-child(2) { animation-delay: 0.68s; }
    .fact:nth-child(3) { animation-delay: 0.84s; }
    .fact:nth-child(4) { animation-delay: 1.00s; }

    .mask-revealing .portal-heading {
      animation: portal-caption 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .planet-list.is-switching .planet-item {
      animation: menu-row 0.58s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: 0.02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: 0.05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: 0.08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: 0.11s; }
    .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: 0.14s; }
    .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: 0.17s; }
    .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: 0.20s; }
    .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: 0.23s; }

    .planet-list.is-switching .planet-item.active:before {
      animation: active-dot 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
    }

    @keyframes reveal-down {
      from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes reveal-side {
      from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
      to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
    }
    @keyframes title-rise {
      from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
      to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
    }
    @keyframes fact-rise {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes portal-caption {
      from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes menu-row {
      from { opacity: 0.35; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes active-dot {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ====================================================================
       11. RESPONSIVE
       ==================================================================== */
    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(300px, 48vw); }
      .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
      .planet-content dl { width: 43vw; }
      .fact { grid-template-columns: 110px 1fr; }
      .planet-list { font-size: 14px; }
      .planet-item.active { font-size: 16px; }
    }
    @media (max-width: 640px) {
      .experience { min-height: 600px; }
      .planet-list { display: none; }
      .portal-wrap { top: 44%; width: min(260px, 66vw); }
      .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
      .planet-content dl { width: 100%; font-size: 13px; }
      .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
      .portal-heading { font-size: 14px; }
      .portal-heading strong { font-size: 16px; }
      .menu { height: 38px; }
      .portal { border-radius: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
      .portal { transform: none !important; }
    }
  </style>
</head>
<body>
  <!-- ====================================================================
       3. DOM STRUCTURE
       ==================================================================== -->
  <main class="experience" data-planet="mars">
    <div class="backgrounds" aria-hidden="true">
      <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
      <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
    </div>

    <div class="preloader" id="preloader" aria-label="Loading Mars">
      <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
      <div class="preloader-shade"></div>
    </div>

    <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Wandering Globe">

    <div class="preloader-count" id="preloader-count" aria-live="polite">
      <span id="preloader-value">0</span><span class="percent">%</span>

    <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <header class="header chrome">
      <div class="header-actions">
        <nav class="nav" aria-label="Primary navigation">
          <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
        </nav>
        <button class="menu" type="button">Menu</button>
      </div>
    </header>

    <aside class="planet-list chrome" aria-label="Planets"></aside>

    <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>

    <section class="portal-wrap chrome" aria-label="Next destination">
      <div class="portal-heading">
        <span>Next:</span>
        <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
      </div>
      <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
        <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
        <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
      </button>
    </section>

    <section class="planet-content chrome" aria-live="polite">
      <h1 id="planet-title">MARS</h1>
      <dl id="facts"></dl>
    </section>

    <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
    <div class="loading" aria-hidden="true">Preparing orbit…</div>

    <div class="custom-cursor" aria-hidden="true">
      <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
    </div>
  </main>

  <script>
    /* ====================================================================
       1. REMOTE ASSETS
       ==================================================================== */
    const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
    const MARS_BG   = `${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`;
    const TO_EARTH  = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
    const TO_VENUS  = `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;
    const TO_MARS   = `${BASE}/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4`;
    const MERCURY   = `${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`;
    const LOGO      = `${BASE}/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg`;

    /* ====================================================================
       4. DATA MODEL
       ==================================================================== */
    const planets = ['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];

    const states = {
      mars:  { name:'Mars',  next:'Earth',   number:'[03]', portal:TO_EARTH,  background:'mars-background',
        facts:[['Distance:','About 228 million km (1.5 astronomical units).'],
               ['Year:','One Martian year is equal to 687 Earth days.'],
               ['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],
               ['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']] },
      earth: { name:'Earth', next:'Venus',   number:'[02]', portal:TO_VENUS,  background:'earth-background',
        facts:[['Distance:','149.6 million km from the Sun.'],
               ['Year:','365.25 Earth days.'],
               ['Temperature:','Average surface temperature around 15 °C.'],
               ['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']] },
      venus: { name:'Venus', next:'Mercury', number:'[06]', image:MERCURY,    background:'venus-background',
        facts:[['Distance:','108.2 million km from the Sun.'],
               ['Year:','225 Earth days.'],
               ['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],
               ['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']] }
    };

    let current = 'mars';
    let busy = false;
    let renderCount = 0;
    let hasFrozenFrame = false;

    // DOM Elements
    const experience = document.querySelector('.experience');
    const planetTitle = document.getElementById('planet-title');
    const nextName = document.getElementById('next-name');
    const nextNumber = document.getElementById('next-number');
    const factsEl = document.getElementById('facts');
    const planetListEl = document.querySelector('.planet-list');
    const portalEl = document.getElementById('portal');
    const portalVideo = document.getElementById('portal-video');
    const portalImage = document.getElementById('portal-image');
    const transitionVideo = document.getElementById('transition-video');
    const portalCanvas = document.getElementById('portal-canvas');
    const sceneCanvas = document.getElementById('scene-canvas');
    const portalCtx = portalCanvas.getContext('2d');
    const sceneCtx = sceneCanvas.getContext('2d');
    const floatingLogo = document.getElementById('floating-logo');
    const preloaderEl = document.getElementById('preloader');
    const preloaderCount = document.getElementById('preloader-count');
    const preloaderVal = document.getElementById('preloader-value');
    const customCursor = document.querySelector('.custom-cursor');
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOrbit = document.querySelector('.cursor-orbit');
    const cursorLabel = document.querySelector('.cursor-label');

    /* ====================================================================
       RENDER STATE
       ==================================================================== */
    function render() {
      const state = states[current];
      experience.setAttribute('data-planet', current);
      planetTitle.textContent = state.name.toUpperCase();
      nextName.textContent = state.next;
      nextNumber.textContent = state.number;
      portalEl.setAttribute('aria-label', `Travel to ${state.next}`);

      // Facts
      factsEl.innerHTML = state.facts
        .map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`)
        .join('');

      // Planet List
      planetListEl.innerHTML = planets
        .map(p => `<span class="planet-item${p === state.name ? ' active' : ''}">${p}</span>`)
        .join('');

      // Retrigger .is-switching on subsequent renders
      if (renderCount > 0) {
        planetListEl.classList.remove('is-switching');
        void planetListEl.offsetWidth; // force reflow
        planetListEl.classList.add('is-switching');
      }
      renderCount++;

      // Background video toggle
      const bgVideos = document.querySelectorAll('.backgrounds .background');
      bgVideos.forEach(bg => {
        if (bg.id === state.background) {
          bg.classList.add('is-visible');
          bg.currentTime = 0;
          bg.loop = true;
          bg.play().catch(() => {});
        } else {
          bg.classList.remove('is-visible');
          bg.pause();
        }
      });

      // Show/hide portal image vs video
      if (state.image) {
        portalImage.style.display = 'block';
        portalVideo.style.display = 'none';
        portalVideo.pause();
      } else {
        portalImage.style.display = 'none';
        portalVideo.style.display = 'block';
        if (portalVideo.src !== state.portal) {
          portalVideo.src = state.portal;
          portalVideo.load();
        }
        portalVideo.loop = true;
        portalVideo.play().catch(() => {});
      }
    }

    /* ====================================================================
       EASING & ANIMATION HELPER
       ==================================================================== */
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animateValue(setter, duration) {
      return new Promise((resolve) => {
        const startTime = performance.now();
        function frame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          setter(easeInOutCubic(progress));
          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            setter(1);
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    /* ====================================================================
       PORTAL & CANVAS SYSTEM (fake 3D perspective window)
       ==================================================================== */
    let targetX = 0;
    let targetY = 0;
    let rotX = 0;
    let rotY = 0;
    let maskScale = 0;
    let expansion = 0;
    let canvasOpacity = 1;
    let transitionActive = false;

    function resizeCanvas() {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      portalCanvas.width = window.innerWidth * d;
      portalCanvas.height = window.innerHeight * d;
      portalCanvas.style.width = window.innerWidth + 'px';
      portalCanvas.style.height = window.innerHeight + 'px';
      portalCtx.setTransform(d, 0, 0, d, 0, 0);

      if (!hasFrozenFrame) {
        sceneCanvas.width = window.innerWidth * d;
        sceneCanvas.height = window.innerHeight * d;
        sceneCanvas.style.width = window.innerWidth + 'px';
        sceneCanvas.style.height = window.innerHeight + 'px';
        sceneCtx.setTransform(d, 0, 0, d, 0, 0);
      }
    }
    window.addEventListener('resize', resizeCanvas);

    function drawCover(ctx, media) {
      if (!media) return;
      let mw = media.videoWidth || media.naturalWidth || media.width || window.innerWidth;
      let mh = media.videoHeight || media.naturalHeight || media.height || window.innerHeight;
      if (!mw || !mh) return;
      const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
      const w = mw * scale;
      const h = mh * scale;
      const x = (window.innerWidth - w) / 2;
      const y = (window.innerHeight - h) / 2;
      ctx.drawImage(media, x, y, w, h);
    }

    function drawShade(ctx) {
      const yStart = window.innerHeight * 0.52;
      const yEnd = window.innerHeight;
      const grad = ctx.createLinearGradient(0, yStart, 0, yEnd);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.88)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, yStart, window.innerWidth, yEnd - yStart);
    }

    function getRoundedRectPoints(w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      const points = [];
      const corners = [
        [ w/2 - r, -h/2 + r, -Math.PI/2, 0 ],
        [ w/2 - r,  h/2 - r, 0, Math.PI/2 ],
        [-w/2 + r,  h/2 - r, Math.PI/2, Math.PI ],
        [-w/2 + r, -h/2 + r, Math.PI, Math.PI * 1.5 ]
      ];
      for (const [cx, cy, a1, a2] of corners) {
        for (let i = 0; i <= 10; i++) {
          const a = a1 + (a2 - a1) * (i / 10);
          points.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
        }
      }
      return points;
    }

    // Pointer tilt listeners
    window.addEventListener('pointermove', (e) => {
      if (!busy) {
        targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
        targetX = (e.clientY / window.innerHeight - 0.5) * -33;
      }
    });

    document.addEventListener('pointerleave', () => {
      if (!busy) {
        targetX = 0;
        targetY = 0;
      }
    });

    let lastDrawTime = performance.now();
    function draw(now) {
      const dt = Math.min(40, now - lastDrawTime);
      lastDrawTime = now;

      // Update tilt with dt interpolation
      rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
      rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

      portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      // Blit frozen scene frame if present
      if (hasFrozenFrame) {
        portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
        drawShade(portalCtx);
      }

      const rect = portalEl.getBoundingClientRect();
      const e = expansion;
      const rectCx = rect.left + rect.width / 2;
      const rectCy = rect.top + rect.height / 2;

      const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
      const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
      const baseW = rect.width + (window.innerWidth - rect.width) * e;
      const baseH = rect.height + (window.innerHeight - rect.height) * e;
      const scale = e ? 1 : maskScale;
      const w = baseW * scale;
      const h = baseH * scale;
      const r = 90 * (1 - e) * scale;
      const rx = rotX * (1 - e);
      const ry = rotY * (1 - e);

      if (w > 1 && h > 1) {
        const points = getRoundedRectPoints(w, h, r);
        const ax = rx * Math.PI / 180;
        const ay = ry * Math.PI / 180;

        portalCtx.save();
        portalCtx.globalAlpha = canvasOpacity;
        portalCtx.beginPath();
        for (let i = 0; i < points.length; i++) {
          const [px, py] = points[i];
          const xx = px * Math.cos(ay);
          const yy = py * Math.cos(ax);
          const z = px * Math.sin(ay) - py * Math.sin(ax);
          const p = 850 / (850 + z);
          const sx = cx + xx * p;
          const sy = cy + yy * p;
          if (i === 0) portalCtx.moveTo(sx, sy);
          else portalCtx.lineTo(sx, sy);
        }
        portalCtx.closePath();
        portalCtx.clip();

        // Fill background behind window
        portalCtx.fillStyle = '#030303';
        portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        // Draw screen-locked cover media
        const mediaSource = transitionActive
          ? transitionVideo
          : (states[current].image ? portalImage : portalVideo);
        drawCover(portalCtx, mediaSource);

        if (transitionActive) {
          drawShade(portalCtx);
        }

        portalCtx.restore();
      }

      requestAnimationFrame(draw);
    }

    /* ====================================================================
       8. TRAVEL TRANSITION
       ==================================================================== */
    function revealMask() {
      experience.classList.remove('mask-revealing');
      void experience.offsetWidth;
      experience.classList.add('mask-revealing');
      maskScale = 0;
      return animateValue(v => maskScale = v, 1050);
    }

    function revealPlanetContent() {
      experience.classList.remove('content-revealing');
      void experience.offsetWidth;
      experience.classList.add('content-revealing');
    }

    async function travel() {
      if (busy || current === 'venus') return;
      busy = true;
      targetX = 0;
      targetY = 0;

      const next = current === 'mars' ? 'earth' : 'venus';

      try {
        transitionVideo.src = states[current].portal;
        transitionVideo.load();
        experience.classList.add('is-loading');

        // Await canplaythrough or error or 1600ms timeout
        await new Promise((resolve) => {
          let resolved = false;
          const onDone = () => {
            if (!resolved) {
              resolved = true;
              transitionVideo.removeEventListener('canplaythrough', onDone);
              transitionVideo.removeEventListener('error', onDone);
              resolve();
            }
          };
          transitionVideo.addEventListener('canplaythrough', onDone, { once: true });
          transitionVideo.addEventListener('error', onDone, { once: true });
          setTimeout(onDone, 1600);
        });

        experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
        experience.classList.add('is-transitioning');

        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        canvasOpacity = 1;
        transitionActive = true;
        await transitionVideo.play().catch(() => {});

        // Window swallows the screen over 1100ms
        await animateValue(v => expansion = v, 1100);

        // Await video ended
        await new Promise((resolve) => {
          if (transitionVideo.ended) return resolve();
          transitionVideo.addEventListener('ended', resolve, { once: true });
          setTimeout(resolve, 4000); // Safety fallback
        });

        // Freeze final frame into #scene-canvas
        hasFrozenFrame = true;
        sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        drawCover(sceneCtx, transitionVideo);

        // Commit new state
        current = next;
        experience.classList.add('is-committing');
        render();

        // Await two rAFs
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        transitionActive = false;
        expansion = 0;
        maskScale = 0;
        canvasOpacity = 1;
        experience.classList.remove('is-transitioning', 'is-committing');

        const maskReveal = revealMask();
        setTimeout(() => revealPlanetContent(), 100);
        await maskReveal;

        setTimeout(() => {
          transitionVideo.removeAttribute('src');
          transitionVideo.load();
          busy = false;
          hasFrozenFrame = false;
        }, 450);

      } catch (err) {
        console.error('Travel transition caught error:', err);
        transitionActive = false;
        expansion = 0;
        maskScale = 1;
        canvasOpacity = 1;
        hasFrozenFrame = false;
        experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
        busy = false;
      }
    }
    portalEl.addEventListener('click', travel);

    /* ====================================================================
       6. PRELOADER & INITIALIZATION
       ==================================================================== */
    let preloaderFinished = false;

    function finishPreloader() {
      if (preloaderFinished) return;
      preloaderFinished = true;
      preloaderVal.textContent = '100';
      preloaderCount.classList.add('is-leaving');
      floatingLogo.classList.add('is-docked');
      preloaderEl.classList.add('is-background');
      document.body.classList.add('preload-complete');

      startExperience();

      setTimeout(() => {
        if (preloaderCount) preloaderCount.remove();
      }, 750);

      setTimeout(() => {
        floatingLogo.classList.add('is-settled');
      }, 2000);
    }

    async function startExperience() {
      // Await current portal media ready
      await new Promise((resolve) => {
        if (portalVideo.readyState >= 2) return resolve();
        portalVideo.addEventListener('loadeddata', resolve, { once: true });
        portalVideo.addEventListener('canplay', resolve, { once: true });
        setTimeout(resolve, 800);
      });

      await revealMask();
      document.body.classList.add('intro-ready');
      setTimeout(() => {
        revealPlanetContent();
      }, 850);
    }

    function runPreloader() {
      const preloaderVideo = document.getElementById('preloader-video');

      function updateCounter() {
        if (preloaderFinished) return;
        if (preloaderVideo.duration && preloaderVideo.duration > 0) {
          const pct = Math.min(100, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
          preloaderVal.textContent = String(pct);
        }
        requestAnimationFrame(updateCounter);
      }

      function onMetaReady() {
        if (preloaderVideo.duration) {
          preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
        }
        preloaderVideo.play().then(() => {
          requestAnimationFrame(updateCounter);
        }).catch(() => {
          finishPreloader();
        });
      }

      if (preloaderVideo.readyState >= 1) {
        onMetaReady();
      } else {
        preloaderVideo.addEventListener('loadedmetadata', onMetaReady, { once: true });
        // Fallback if metadata event is delayed
        setTimeout(() => {
          if (!preloaderFinished && preloaderVideo.currentTime === 0) {
            onMetaReady();
          }
        }, 1200);
      }

      preloaderVideo.addEventListener('ended', finishPreloader, { once: true });
      preloaderVideo.addEventListener('error', finishPreloader, { once: true });

      // Absolute safety timeout (~3.8s) so page is never blocked
      setTimeout(() => {
        if (!preloaderFinished) finishPreloader();
      }, 3800);
    }

    /* ====================================================================
       9. CUSTOM CURSOR LOOP
       ==================================================================== */
    let pointerX = window.innerWidth / 2;
    let pointerY = window.innerHeight / 2;
    let orbitX = pointerX;
    let orbitY = pointerY;
    let cursorVisible = false;

    window.addEventListener('pointermove', (e) => {
      pointerX = e.clientX;
      pointerY = e.clientY;
      if (!cursorVisible) {
        cursorVisible = true;
        customCursor.classList.add('is-visible');
      }
    });

    document.addEventListener('mouseleave', () => {
      cursorVisible = false;
      customCursor.classList.remove('is-visible');
    });

    portalEl.addEventListener('pointerenter', () => {
      customCursor.classList.add('is-enter');
    });
    portalEl.addEventListener('pointerleave', () => {
      customCursor.classList.remove('is-enter');
    });

    function cursorLoop() {
      orbitX += (pointerX - orbitX) * 0.2;
      orbitY += (pointerY - orbitY) * 0.2;

      cursorDot.style.transform = `translate3d(${pointerX}px, ${pointerY}px, 0) translate(-50%, -50%)`;
      cursorOrbit.style.transform = `translate3d(${orbitX}px, ${orbitY}px, 0) translate(-50%, -50%)`;
      cursorLabel.style.transform = `translate3d(${orbitX}px, ${orbitY}px, 0) translateX(-50%)`;

      requestAnimationFrame(cursorLoop);
    }

    /* ====================================================================
       12. BOOT ORDER (last lines of script)
       ==================================================================== */
    // Pause + rewind every .background video
    document.querySelectorAll('.backgrounds .background').forEach(v => {
      v.pause();
      v.currentTime = 0;
    });

    resizeCanvas();
    render();
    requestAnimationFrame(draw);
    requestAnimationFrame(cursorLoop);
    runPreloader();
  </script>
</body>
</html>
